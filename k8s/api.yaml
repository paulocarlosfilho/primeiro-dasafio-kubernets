# ==========================================
# API 1 (Desafio 1)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desafio1-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: desafio1-api
  template:
    metadata:
      labels:
        app: desafio1-api
    spec:
      containers:
        - name: desafio1
          image: paulocarlosfilho/desafio1-api:v1.0.1
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: POSTGRES_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: desafio1-service
spec:
  type: ClusterIP
  selector:
    app: desafio1-api
  ports:
    - port: 80
      targetPort: 3000
---
